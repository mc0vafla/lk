[colors]
background = #392b2b
foreground = #d3c6aa
accent     = #e680a0
text       = #a68d8d
bg_dim     = #392b2b
light      = #f5e6e6
suffix     = #e67e80

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/top]
monitor = HDMI-1
monitor-fallback = VGA-1
width = 100%
height = 22
fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2

padding-left = 0
padding-right = 1
module-margin = 1

font-0 = "DepartureMono:size=10:style=Regular;2"
font-1 = "Symbols Nerd Font:size=10;2"

modules-left = i3 
modules-center = tray
modules-right = pulseaudio memory cpu xkeyboard date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-padding = 2px
tray-size = 60%
tray-background = ${colors.background}

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true

label-focused = "[ %index% ]"
label-focused-foreground = ${colors.light}
label-focused-underline = ${colors.accent}
label-focused-padding = 1

label-visible = "< %index% >"
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-unfocused = "  %index%  "
label-unfocused-foreground = ${colors.text}

label-urgent = "! %index% !"
label-urgent-foreground = ${colors.suffix}
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.accent}
label = "%percentage%%  |"
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.accent}
label = "%gb_used%  |"
label-foreground = ${colors.text}

[module/pulseaudio]
type = internal/pulseaudio
interval = 5
label-volume = "%percentage%%  |"
label-volume-foreground = ${colors.text}

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.accent}

label-muted = "󰝟 mute  |"
label-muted-foreground = ${colors.suffix}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.accent}
label-layout = "%layout%  |"
label-layout-foreground = ${colors.text}

[module/date]
type = internal/date
interval = 1
time = "%H:%M"
date = "%d.%m"
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.accent}
label = "%date% %time%"
label-foreground = ${colors.text}
