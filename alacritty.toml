[window.padding]
x = 12
y = 8

[font]
size = 12.0

[font.normal]
family = "DepartureMono"
style = "Regular"

[font.bold]
family = "DepartureMono"
style = "Bold"

[font.italic]
family = "DepartureMono"
style = "Italic"

[colors.primary]
# background = "#1D1E1F"
# background = "#302D30"
background = "#282828"
foreground = "#d3c6aa"

[colors.cursor]
text = "CellBackground"
cursor = "#e67e80"

[colors.normal]
black   = "#5c4b4b"
red     = "#e67e80"
green   = "#5c4b50"
yellow  = "#e6a080"
blue    = "#e680a0"
magenta = "#e680c0"
cyan    = "#e68080"
white   = "#e6cccc"

[colors.bright]
black   = "#725c5c"
red     = "#f09496"
green   = "#f0a294"
yellow  = "#f0b594"
blue    = "#f094b5"
magenta = "#f094d5"
cyan    = "#f09494"
white   = "#f5e6e6"

[terminal]
shell = "fish"

[scrolling]
multiplier = 6

[[keyboard.bindings]]
key = "v"
mods = "Alt"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "/"
mods = "Alt"
action = "SearchForward"

[[keyboard.bindings]]
key = "j"
mods = "Alt"
chars = " > /dev/null 2>&1"

[[keyboard.bindings]]
key = "x"
mods = "Alt"
chars = "u \n"

[[keyboard.bindings]]
key = "z"
mods = "Alt"
chars = "dell \n"

[[keyboard.bindings]]
key = "d"
mods = "Control|Alt|Shift"
chars = "nvim ~/.config/nvim/lua/mappings.lua \n"

[[keyboard.bindings]]
key = "k"
mods = "Alt"
chars = "doas nvim /usr/share/applications/template.desktop \n i[Desktop Entry]\nName=\nGenericName=\nType=Application\nTerminal=false\nExec=fish -c\nIcon=\nCategories=\nX-AppImage-Integrate=false"
