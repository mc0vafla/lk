# bind=ALT+SHIFT,s,movewin,+0,+100
# bind=ALT+SHIFT,a,movewin,-100,+0
# bind=ALT+SHIFT,d,movewin,+100,+0

bind=ALT,q,resizewin,-200,-200
bind=ALT,e,resizewin,+200,+200
# bind=ALT+SHIFT,w,resizewin,0,+150
# bind=ALT+SHIFT,q,resizewin,0,-150

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
windowrule=appid:imv,isfloating:1
windowrule=appid:mpv,isfloating:1

bind=SUPER+SHIFT,e,spawn,noctalia msg settings-toggle
bind=SUPER,ESCAPE,spawn,pcmanfm
bind=ALT,1,spawn,noctalia msg screenshot-region
bind=ALT,2,spawn,noctalia msg screenshot-fullscreen pick
# bind=ALT,ESCAPE,spawn,noctalia msg panel-open wallpaper
bind=SUPER,b,spawn,alacritty -e fish -c b
bind=SUPER,n,spawn,alacritty -e fish -c nv
bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER,e,spawn,noctalia msg panel-toggle control-center
bind=ALT,3,spawn,noctalia msg panel-toggle session
bind=SUPER,k,spawn,alacritty -e fish -c o
bind=ALT,d,spawn_shell,hyprpicker | wl-copy; noctalia msg notification-show Hyprpicker Color was copied

