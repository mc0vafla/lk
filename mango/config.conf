exec-once=noctalia
exec-once=ydotoold
exec=ydotool mousemove --absolute 1435 250
exec-once=/usr/lib/xdg-desktop-portal-wlr
monitorrule=name:eDP-1,width:1920,height:1080,refresh:165,x:0,y:0
monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:74.973,x:1920,y:0

exec-once=zen-browser
exec-once=spotify
exec-once=Telegram
exec-once=vesktop
exec-once=view,1,0

tagrule=id:1,monitor_name:HDMI-A-1,layout_name:scroller
tagrule=id:1,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

windowrule=tags:1,monitor:eDP-1,isopensilent:1,istagsilent:1,appid:zen
windowrule=tags:3,monitor:HDMI-A-1,isopensilent:1,istagsilent:1,appid:Spotify
windowrule=tags:2,monitor:HDMI-A-1,isopensilent:1,istagsilent:1,appid:vesktop
windowrule=tags:2,monitor:HDMI-A-1,isopensilent:1,istagsilent:1,appid:org.telegram.desktop
# windowrule=tags:1,monitor:HDMI-A-1,isopensilent:1,istagsilent:1,appid:steam

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 10
blur_params_noise = 0.05
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 5
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=0.9
unfocused_opacity=0.8

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.75
zoom_end_ratio=1.0
fadein_begin_opacity=0.2
fadeout_begin_opacity=1.0
animation_duration_open=220
animation_duration_close=180
animation_duration_move=280
animation_duration_tag=240
animation_duration_focus=150
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.25,1,0.5,1
animation_curve_tag=0.25,1,0.5,1
animation_curve_close=0.42,0,1,1
animation_curve_focus=0.25,1,0.5,1
animation_curve_opafadein=0.25,1,0.5,1
animation_curve_opafadeout=0.42,0,0.58,1

scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
# scroller_proportion_preset=0.6,0.75,0.9

new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
ov_no_resize=1
overviewgappi=15
overviewgappo=5

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=20
cursor_theme=Breeze_Light
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

repeat_rate=25
repeat_delay=300
numlockon=0
xkb_rules_layout=us,ru
bind=SUPER,SPACE,switch_keyboard_layout

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

mouse_natural_scrolling=0

gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
# rootcolor=0x1a1213ff
# bordercolor=0x3a2a2bff
# focuscolor=0xe6a190ff
# splitcolor=0xd3362aff
# maximizescreencolor=0xe6a170ff
