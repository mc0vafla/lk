# scratchpadcolor=0x9c4a37ff
# dropcolor=0xe6a190ff
# globalcolor=0xe6a190ff
# overlaycolor=0x7a1f3dff

bind=SUPER+SHIFT,r,reload_config
circle_layout=scroller,vertical_scroller
bind=SUPER,x,switch_layout
bind=SUPER,c,setlayout,dwindle
bind=ALT,a,toggle_all_floating
bind=SUPER,z,setlayout,grid

bind=SUPER,V,spawn,noctalia msg panel-toggle launcher
bind=ALT,v,spawn,rofi -show drun
bind=SUPER,Return,spawn,alacritty

bind=SUPER,m,quit
bind=SUPER,q,killclient,

bind=ALT,Tab,focusstack,next
bind=SUPER,a,focusdir,left
bind=SUPER,d,focusdir,right
bind=ALT,w,focusdir,up
bind=ALT,s,focusdir,down
bind=SUPER+SHIFT,w,focusdir,up
bind=SUPER+SHIFT,s,focusdir,down
bind=SUPER,s,viewtoright,0
bind=SUPER,w,viewtoleft,0
bind=ALT+CTRL,s,tagtoright,0
bind=ALT+CTRL,w,tagtoleft,0

bind=SUPER+ctrl,w,exchange_client,up
bind=SUPER+ctrl,s,exchange_client,down
bind=SUPER+ctrl,a,exchange_client,left
bind=SUPER+ctrl,d,exchange_client,right

bind=SUPER,g,toggleglobal,
bind=ALT,x,togglefloating,
bind=ALT,f,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=ALT,z,minimized,
bind=ALT,c,restore_minimized
bind=SUPER,TAB,toggleoverview

