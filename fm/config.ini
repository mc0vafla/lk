[General]
terminal=l-term
show_hidden=true
view_mode=1
sort_mode=2
icon_size=72

[Keybinds]
open=Return
new_file=<Primary>n
new_dir=<Primary><Shift>n
rename=<Primary>s
trash=<Primary>e
copy=<Primary>c
cut=<Primary>x
paste=<Primary>v
undo=<Primary>z
terminal=<Primary>w
up=<Primary>q
home=<Primary>Tab
back=<Alt>Left
forward=<Alt>Right
refresh=<Primary>r
hidden=<Primary>h
focus_path=<Primary>l
settings=<Primary>space
custom_menu=<Primary><Shift>space
view_list=<Primary>1
view_icons=<Primary>2
pin_current=<Primary>d

[CustomActions]
action_0=krita|krita %s
action_1=imv|imv %s
action_2=umu|fish -c "umu-run %s"
action_3=mpv|mpv %s
action_4=nvim|nvim %s
action_5=helium|helium %s
